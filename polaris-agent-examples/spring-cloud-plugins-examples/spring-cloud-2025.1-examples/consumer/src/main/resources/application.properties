server.port=${CONSUMER_PORT:48082}
spring.application.name=service-consumer-2025-1
spring.config.import=optional:nacos:${spring.application.name}.properties
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.username=${NACOS_USERNAME:}
spring.cloud.nacos.password=${NACOS_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
demo.message=hello-from-sca-2025.1
