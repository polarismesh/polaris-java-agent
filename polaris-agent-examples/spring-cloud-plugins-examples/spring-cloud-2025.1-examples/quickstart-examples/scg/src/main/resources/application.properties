server.port=${SCG_PORT:48080}
spring.application.name=scg-gateway-2025-1
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.discovery.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.discovery.enabled=true
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:}
spring.cloud.nacos.config.group=${NACOS_GROUP:DEFAULT_GROUP}
spring.cloud.nacos.config.enabled=true
spring.cloud.nacos.username=${NACOS_USERNAME:}
spring.cloud.nacos.password=${NACOS_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
demo.message=hello-from-sca-2025.1
spring.main.web-application-type=reactive
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.server.webflux.routes[0].id=consumer
spring.cloud.gateway.server.webflux.routes[0].uri=lb://service-consumer-2025-1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/consumer/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webflux.routes[1].id=provider
spring.cloud.gateway.server.webflux.routes[1].uri=lb://service-provider-2025-1
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/provider/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

#---
spring.config.activate.on-profile=!local
spring.config.import=optional:nacos:${spring.application.name}.properties
